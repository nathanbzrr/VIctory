[package]
name = "xtask"
description = "Repository maintenance: asset-policy enforcement, git hooks, the D3D12 Agility SDK runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
walkdir.workspace = true
# Inflates the Agility SDK package (`cargo xtask agility`); the workspace
# itself uses zlib-rs and does not list this crate.
miniz_oxide = "0.9.1"
# SHA-512 of the Agility SDK package (`cargo xtask agility`).
sha2 = "0.10"

[lints]
workspace = true
